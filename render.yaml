services:
  - type: web
    name: x-for-you-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: "18"
      # 以下变量需要在 Render Dashboard 中手动设置
      # SUPABASE_URL
      # SUPABASE_SERVICE_KEY
      # X_AUTH_TOKEN
      # X_CT0
      # X_BEARER_TOKEN (可选，有默认值)
      # HOME_TIMELINE_QUERY_ID (可选，有默认值)
      # HOME_LATEST_TIMELINE_QUERY_ID (可选，有默认值)
